$mod = SUPER # Sets "Windows" key as main modifier

# Spawning Terminals
binde  = $mod,			RETURN,			exec,							$terminal
binde  = $mod CTRL,		RETURN,			exec,							$floatingTerminal

# Window Control
binde  = $mod,			P,				killactive,
binde  = $mod,			Q,				killactive,
bind   = $mod,			SPACE,			togglefloating,
binde  = $mod,			V,				togglesplit,
bind   = $mod ALT,		F,				fullscreen,						0
bind   = $mod,			C,				centerwindow,					none

# Rofi Menus
bind   = $mod,			R,				exec,							$menu
bind   = $mod ALT,		Q,				exec,							$powerMenu
bind   = $mod CTRL,		E,				exec,							$editMenu
bind   = $mod ALT,		4,				exec,							$emojiselector

# Wallpaper
bind   = $mod,			W,				exec,							$changeWallpaper pywal
bind   = $mod SHIFT,	W,				exec,							$changeWallpaper nopywal
bind   = $mod CTRL,		W,				exec,							$changeWallpaper justpywal
bind   = $mod ALT,		W,				exec,							$changeWalBackend
bind   = $mod CTRL ALT,	W,				exec,							$changeWalSaturation

# Launch Programs
bind   = $mod,			E,				exec,							$fileManager
bind   = $mod,			Y,				exec,							$fileManagerTui
bind   = $mod,			D,				exec,							$browser
bind   = $mod,			M,				exec,							$musicPlayer

# Waybar Control
bind   = $mod,			grave,			exec,							$waybarControl togglehide
bind   = $mod SHIFT,	grave,			exec,							$waybarControl toggle
bind   = $mod CTRL,		grave,			exec,							$waybarControl reload

# Alacritty Opacity Control
binde  = $mod,			O,				exec,							$changeOpacity increase
binde  = $mod SHIFT,	O,				exec,							$changeOpacity decrease
bind   = $mod CTRL,		O,				exec,							$changeOpacity reset

# Music/Audio Control
bind   = $mod,			bracketLeft,	exec,							mpc toggle
bind   = $mod,			bracketRight,	exec,							mpc clear
binde  = $mod,			comma,			exec,							mpc volume -5
binde  = $mod,			period,			exec,							mpc volume +5
binde  = $mod SHIFT,	comma,			exec,							mpc seek -0:0:5
binde  = $mod SHIFT,	period,			exec,							mpc seek +0:0:5
binde  = $mod CTRL,		comma,			exec,							mpc prev
binde  = $mod CTRL,		period,			exec,							mpc next
bind   = $mod CTRL,		P,				exec,							pavucontrol
bind   = $mod,			apostrophe,		exec,							$toggleReverb
bind   = $mod SHIFT,	apostrophe,		exec,							$toggleReverb 'Firefox'

# Screenshots
bind   = $mod,			G,				exec,							$screenshot fullscreen
bind   = $mod CTRL,		G,				exec,							$screenshot selection
bind   = $mod SHIFT,	G,				exec,							$ocr
bind   = $mod ALT,		G,				exec,							$terminal -e yazi "$HOME/Pictures/Screenshots"
bind   = $mod ALT,		2,				exec,							$qrscanner

# Miscellaneous
bind   = $mod SHIFT,	P,				exec,							$prop
bind   = $mod,			backslash,		exec,							$screenlock
bind   = $mod ALT,		1,				exec,							$colorpicker
bind   = $mod ALT,		3,				exec,							$floatingTerminal -e $scripts/colorscripts.sh
bind   = $mod ALT,		5,				exec,							$clock

# Monitors
bind   = $mod,			U,				focusmonitor,					-1
bind   = $mod,			I,				focusmonitor,					+1
bind   = $mod ALT,		U,				movewindow,						mon:-1
bind   = $mod ALT,		I,				movewindow,						mon:+1

# Move Focus
bind   = $mod,			H,				movefocus,						l
bind   = $mod,			L,				movefocus,						r
bind   = $mod,			K,				movefocus,						u
bind   = $mod,			J,				movefocus,						d

# Swap Window
binde  = $mod CTRL,		H,				swapwindow,						l
binde  = $mod CTRL,		L,				swapwindow,						r
binde  = $mod CTRL,		K,				swapwindow,						u
binde  = $mod CTRL,		J,				swapwindow,						d

# Resize Window
binde  = $mod SHIFT,	H,				resizeactive,					-15 0
binde  = $mod SHIFT,	L,				resizeactive,					 15 0
binde  = $mod SHIFT,	K,				resizeactive,					 0 -15
binde  = $mod SHIFT,	J,				resizeactive,					 0  15

# Move Floating Window
binde  = $mod ALT,		H,				moveactive,						-15 0
binde  = $mod ALT,		L,				moveactive,						 15 0
binde  = $mod ALT,		K,				moveactive,						 0 -15
binde  = $mod ALT,		J,				moveactive,						 0  15

# Resize Window 
binde  = $mod ALT SHIFT,H,				resizeactive,					-30 0
binde  = $mod ALT SHIFT,L,				resizeactive,					 30 0
binde  = $mod ALT SHIFT,K,				resizeactive,					 0 -30
binde  = $mod ALT SHIFT,J,				resizeactive,					 0  30
binde  = $mod ALT SHIFT,H,				moveactive,						 15 0
binde  = $mod ALT SHIFT,L,				moveactive,						-15 0
binde  = $mod ALT SHIFT,K,				moveactive,						 0  15
binde  = $mod ALT SHIFT,J,				moveactive,						 0 -15

# Move Workspace Focus
bind   = $mod,			1,				workspace,						1
bind   = $mod,			2,				workspace,						2
bind   = $mod,			3,				workspace,						3
bind   = $mod,			4,				workspace,						4
bind   = $mod,			5,				workspace,						5
bind   = $mod,			6,				workspace,						6
bind   = $mod,			7,				workspace,						7
bind   = $mod,			8,				workspace,						8
bind   = $mod,			9,				workspace,						9
bind   = $mod,			0,				workspace,						10

# Move Workspace
bind   = $mod CTRL,		1,				movetoworkspace,				1
bind   = $mod CTRL,		2,				movetoworkspace,				2
bind   = $mod CTRL,		3,				movetoworkspace,				3
bind   = $mod CTRL,		4,				movetoworkspace,				4
bind   = $mod CTRL,		5,				movetoworkspace,				5
bind   = $mod CTRL,		6,				movetoworkspace,				6
bind   = $mod CTRL,		7,				movetoworkspace,				7
bind   = $mod CTRL,		8,				movetoworkspace,				8
bind   = $mod CTRL,		9,				movetoworkspace,				9
bind   = $mod CTRL,		0,				movetoworkspace,				10

# Special Workspace
bind   = $mod,			S,				togglespecialworkspace,			magic
bind   = $mod CTRL,		S,				movetoworkspace,				special:magic

# Minimize window
bind   = $mod,			N,				togglespecialworkspace,			minimize
bind   = $mod,			N,				movetoworkspace,				+0
bind   = $mod,			N,				togglespecialworkspace,			minimize
bind   = $mod,			N,				movetoworkspace,				special:minimize
bind   = $mod,			N,				togglespecialworkspace,			minimize

# Move Relative Workspace Focus
bind   = $mod,			mouse_down,		workspace,						e+1
bind   = $mod,			mouse_up,		workspace,						e-1
binde  = $mod,			F,				cyclenext,						floating
binde  = $mod,			B,				cyclenext,						tiled
binde  = $mod CTRL,		F,				movetoworkspace,				+1
binde  = $mod CTRL,		B,				movetoworkspace,				-1

# Mouse
bindm  = $mod,			mouse:272,		movewindow
bindm  = $mod,			mouse:273,		resizeactive
# bindm  = $mod,			mouse:274,		togglefloating <- Not working

# Laptop fn keys
bindel = ,XF86AudioRaiseVolume,				exec, 						wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume,				exec,						wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindel = ,XF86AudioMute,					exec,						wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,					exec,						wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,				exec,						brightnessctl s 50%+
bindel = ,XF86MonBrightnessDown,			exec,						brightnessctl s 50%-
