# ------------ [ C ] ------------
---
If:
  PathMatch: [.*\.c, .*\.h]
CompileFlags:
  Compiler: gcc
  Add: [-xc, -std=c11, -Wall, -Wextra]

Diagnostics:
  # UnusedIncludes: None
  #Suppress: -Wunused
...

# ------------ [ C++ ] ------------
---
If:
  PathMatch: [.*\.cpp, .*\.hpp]
CompileFlags:
  Compiler: g++
  Add: [-xc++, -std=c++11, -Wall, -Wextra]

Diagnostics:
  # UnusedIncludes: None
  #Suppress: -Wunused
...
