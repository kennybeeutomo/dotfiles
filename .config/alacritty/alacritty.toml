[general]
import = ["~/.cache/wal/colors-alacritty.toml"]

[font]
size = 14.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "Space"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollLineUp"
key = "k"
mods = "Alt"

[[keyboard.bindings]]
action = "ScrollLineDown"
key = "j"
mods = "Alt"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "k"
mods = "Alt|Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "j"
mods = "Alt|Shift"

[window]
opacity = 0.8

[mouse]
hide_when_typing = true
