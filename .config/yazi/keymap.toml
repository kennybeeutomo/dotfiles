"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]

prepend_keymap = [
	{ on = "Z",             run = "plugin fzf",                  desc = "Jump to a file/directory via fzf" },
	{ on = "z",             run = "plugin zoxide",               desc = "Jump to a directory via zoxide" },
	{ on = "<C-D>",         run = "remove --permanently",        desc = "Permanently delete selected files" },
	{ on = ["D"],           run = "noop"},
	{ on = [ "g", "e" ],    run  = "cd ~/code/experimentation",  desc = "Go to Experimentation" },
	{ on = [ "g", "z" ],    run  = "cd ~/clipboard",             desc = "Go to Clipboard" },
	{ on = [ "g", "s" ],    run  = "cd ~/Pictures/Screenshots",  desc = "Go to Screenshots" },
	{ on = "<C-e>",         run  = "shell --orphan 'thunar'",    desc = "Open in Thunar" },
	{ on = [ "g", "7" ],    run  = 'shell -- 7z a a.zip "$@"',   desc = "Zip" },
	{ on = [ "g", "r" ],    run  = 'shell --block -- irename.sh "$0"',   desc = "Rename in editor" },
]
